name: Collect and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - watched.txt
      - site/**
      - scripts/**
      - .github/workflows/collect.yml
      - package.json
      - package-lock.json

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Use the latest main, not the commit that triggered the run. A queued or
      # re-run job would otherwise rebuild on data that a newer run has replaced.
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - name: Collect character data
        id: collect
        continue-on-error: true
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
        run: node scripts/collect.mjs

      - name: Commit data
        run: |
          git add site/data/characters.json site/screenshots
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update character data'
          git pull --rebase -X theirs origin main
          git push origin HEAD:main

      - name: Prepare quest catalog
        run: npm run prepare:quests

      - id: pages-upload
        uses: actions/upload-pages-artifact@v5
        with:
          # GitHub keeps artifacts from prior attempts of this run.
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy uploaded Pages artifact
        id: deploy
        uses: actions/github-script@v8
        timeout-minutes: 12
        env:
          PAGES_ARTIFACT_ID: ${{ steps.pages-upload.outputs.artifact_id }}
        with:
          script: |
            const artifactId = process.env.PAGES_ARTIFACT_ID;
            if (!/^\d+$/.test(artifactId ?? '')) {
              throw new Error('Pages upload did not return an artifact ID');
            }
            const oidcToken = await core.getIDToken();
            core.setSecret(oidcToken);
            const { data: deployment } = await github.request(
              'POST /repos/{owner}/{repo}/pages/deployments',
              {
                ...context.repo,
                artifact_id: Number(artifactId),
                pages_build_version: context.sha,
                oidc_token: oidcToken,
              },
            );
            core.setOutput('page_url', deployment.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const { data } = await github.request(
                'GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}',
                { ...context.repo, deployment_id: deployment.id },
              );
              core.info('Pages deployment status: ' + data.status);
              if (data.status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'build_failed',
                   'deployment_cancelled', 'cancelled', 'failed'].includes(data.status)) {
                throw new Error('Pages deployment failed: ' + data.status);
              }
              await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Timed out waiting for Pages deployment');

      - name: Report collection failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
